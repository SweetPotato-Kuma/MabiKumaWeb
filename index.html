<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>마비쿠마 (MabiKuma) · 마비노기 경매장 시세와 아이템 정보</title>
    <meta name="description" content="마비쿠마(MabiKuma)는 마비노기 경매장 시세, 아이템 정보와 장비 시뮬레이터, 던전 코인 가치, 유물 시세를 넥슨 오픈 API로 찾아 보는 도구입니다." />
    <meta name="color-scheme" content="light dark" />
    <!-- 앱이 뜨기 전 첫 화면 색을 사용자가 고른 테마에 맞춘다. 저장 키는 src/lib/themePreference.ts 와 같다. -->
    <script>
      try {
        var mode = localStorage.getItem('mabikuma:themeMode');
        if (mode === 'light' || mode === 'dark') document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    </script>
    <!--
      처음이면 연결(DNS, TCP, TLS)부터 맺느라 그림이 늦게 뜬다. 앱이 뜨는 동안 미리 연결해 둔다.
      fetch(CORS)로 받는 곳은 crossorigin 을 붙이고, img 로 받는 곳은 붙이지 않는다.
      그림 도메인에서는 그림 목록(fetch)과 그림(img)을 둘 다 받으므로 두 가지 연결을 모두 열어 둔다.
    -->
    <link rel="preconnect" href="%VITE_PROXY_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_ICON_BASE_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_ICON_BASE_URL%" />
    <meta name="naver-site-verification" content="27284032f7bef3eb99d76267813fe3ebae164271" />
    <meta name="google-adsense-account" content="ca-pub-1264732037251127" />
    <!--
      광고 스크립트는 화면이 다 그려지고 브라우저가 한가해진 뒤에 붙인다. 첫 화면을 그리는 동안
      대역폭과 CPU 를 나눠 쓰면 화면이 늦게 뜬다. 사이트 소유 확인은 위의 meta 로 한다.
    -->
    <script>
      addEventListener('load', function () {
        var attach = function () {
          var ad = document.createElement('script');
          ad.async = true;
          ad.crossOrigin = 'anonymous';
          ad.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1264732037251127';
          document.head.appendChild(ad);
        };
        if ('requestIdleCallback' in window) requestIdleCallback(attach, { timeout: 3000 });
        else setTimeout(attach, 1500);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
