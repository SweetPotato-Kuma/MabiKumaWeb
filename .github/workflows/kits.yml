name: Collect kit probabilities

on:
  # 손으로도 돌릴 수 있어야 한다. 새 키트가 나온 날 바로 담을 때 쓴다.
  workflow_dispatch:
  # 키트는 목요일 점검 뒤에 바뀌고 2주쯤 판다. 하루 두 번(한국 10:00, 22:00)이면 놓치지 않는다.
  schedule:
    - cron: '0 1,13 * * *'

# contents 는 결과 커밋용, 나머지는 이어서 부르는 배포용.
permissions:
  contents: write
  pages: write
  id-token: write

# 겹쳐 돌면 같은 파일을 두 번 쓴다.
concurrency:
  group: kits
  cancel-in-progress: false

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        run: node scripts/build-kits.mjs

      - name: Commit
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/data/kits.json public/data/kits)" ]; then
            echo "바뀐 키트가 없습니다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/kits.json public/data/kits
          git commit -m "chore: update kit probabilities ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # 키트가 바뀌었을 때만 사이트에 반영한다.
  deploy:
    name: Deploy
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
