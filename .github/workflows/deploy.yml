name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 사전 수집이 끝난 뒤 이어서 부른다. GITHUB_TOKEN 으로 만든 커밋은 push 이벤트를
  # 일으키지 못하므로(재귀 방지), 그 경우 배포가 여기로 들어온다.
  workflow_call:

# GITHUB_TOKEN 에 Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 죽이지 않고 큐에 쌓는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # configure-pages 가 알려주는 base_path 를 그대로 사용하므로
        # 레포지토리 이름을 바꿔도 배포 경로가 자동으로 맞는다.
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Actions Variable 은 자동으로 환경변수가 되지 않는다. 여기서 꺼내 써야
          # 번들에 프록시 주소가 박힌다. 비어 있으면 앱은 "키 직접 입력" 모드로 뜬다.
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          # 그림과 카테고리별 그림 목록이 나가는 CDN. 공개 주소이고 worker/wrangler.toml 의
          # ICON_BASE_URL 과 같아야 한다. 비우면 표의 그림이 워커 조회를 기다렸다 뜬다.
          VITE_ICON_BASE_URL: https://icons.spkuma.com
        run: npm run build

      # 지금 올라가 있는 사이트와 비교해 새로 생기거나 바뀐 주소를 뽑아 둔다. 배포가 끝나면
      # 비교할 옛 판이 사라지므로 배포 전에 한다. 알리는 일은 배포를 막지 않는다.
      - name: List changed URLs for IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs prepare indexnow-urls.txt

      - name: Upload IndexNow list
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 새 쪽과 키 파일이 올라간 뒤에 알려야 검색엔진이 와서 확인할 수 있다.
      - name: Checkout scripts
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Download IndexNow list
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Notify IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs submit indexnow-urls.txt
