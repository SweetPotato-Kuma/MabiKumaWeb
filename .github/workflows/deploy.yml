name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포를 죽이지 않고 큐에 쌓는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # configure-pages 가 알려주는 base_path 를 그대로 사용하므로
        # 레포지토리 이름을 바꿔도 배포 경로가 자동으로 맞는다.
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Actions Variable 은 자동으로 환경변수가 되지 않는다. 여기서 꺼내 써야
          # 번들에 프록시 주소가 박힌다. 비어 있으면 앱은 "키 직접 입력" 모드로 뜬다.
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
